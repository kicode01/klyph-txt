<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="ref-3-editorial-prism-title">
  <title id="ref-3-editorial-prism-title">Klyph The Dimensional Editorial Prism</title>
  <style>
    :root {
      --klyph-base: #080b10;
      --klyph-glyph: #00f0ff;
      --klyph-keystone: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --klyph-base: #fbfaf6;
        --klyph-glyph: #0284c7;
        --klyph-keystone: #d97706;
      }
    }
    .klyph-base { fill: var(--klyph-base); }
    .klyph-glyph { fill: var(--klyph-glyph); }
    .klyph-keystone { fill: var(--klyph-keystone); }
  </style>
<rect width="256" height="256" rx="60" class="klyph-base"/>
  <!-- Front vertical foundation pillar -->
  <rect x="52" y="44" width="36" height="168" rx="8" class="klyph-glyph"/>
  <!-- Upper fold blade: pure cyan -->
  <polygon points="100,128 176,52 216,52 140,128" class="klyph-glyph"/>
  <!-- Lower foundation facet: deeper lapis tone creating physical depth -->
  <polygon points="120,116 196,192 160,192 96,128" fill="#0284c7"/>
  <!-- Central golden amber keystone hinge -->
  <polygon points="100,128 124,104 148,128 124,152" class="klyph-keystone"/>
</svg>
