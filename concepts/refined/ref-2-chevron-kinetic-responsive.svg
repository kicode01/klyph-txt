<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="ref-2-chevron-kinetic-title">
  <title id="ref-2-chevron-kinetic-title">Klyph The Continuous Kinetic Chevron</title>
  <style>
    :root {
      --klyph-base: #080b10;
      --klyph-glyph: #00f0ff;
      --klyph-keystone: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --klyph-base: #fbfaf6;
        --klyph-glyph: #0284c7;
        --klyph-keystone: #d97706;
      }
    }
    .klyph-base { fill: var(--klyph-base); }
    .klyph-glyph { fill: var(--klyph-glyph); }
    .klyph-keystone { fill: var(--klyph-keystone); }
  </style>
<rect width="256" height="256" rx="60" class="klyph-base"/>
  <!-- Vertical pillar with subtle 45-deg beveled terminals -->
  <path d="M52 52 L60 44 H88 V212 H60 L52 204 Z" class="klyph-glyph"/>
  <!-- Continuous 45-deg chevron prism -->
  <path d="M112 128 L188 52 H220 L144 128 L220 204 H188 Z" class="klyph-glyph"/>
  <!-- Inset golden amber keystone eye -->
  <polygon points="120,116 132,128 120,140 108,128" class="klyph-keystone"/>
</svg>
