<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1404 1292" width="1404" height="1292">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Poster Background -->
  <rect width="1404" height="1292" fill="#090a0f"/>
  
  <!-- Header Title -->
  <text x="48" y="74" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">Klyph. 6 Creative Metaphors.</text>
  <text x="48" y="112" font-size="19" font-weight="500" fill="#94a3b8">Every mark has a brain, an ownable double-meaning, and zero generic filler. Pure vector master files.</text>
  <text x="1356" y="112" font-size="14" font-weight="600" fill="#64748b" text-anchor="end" letter-spacing="1">LOGO-DESIGN-SKILL · PRODUCTION AUDITED</text>
  <line x1="48" y1="140" x2="1356" y2="140" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Cards -->
  
    <!-- Card 1: Nibcursor -->
    <g transform="translate(48, 180)">
      <!-- Background Tile -->
      <rect width="420" height="520" rx="28" fill="#0f172a"/>
      <!-- Category Tag -->
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="0.5" opacity="0.85">SYNTAX & CRAFT</text>
      <!-- Center Mark Area -->
      <g transform="translate(105, 76) scale(0.82)">
        
  <title id="k-nib-title">Klyph Nibcursor - The cursor writes with a pen's soul</title>
  <!-- Foundation Cursor Bar -->
  <rect x="48" y="44" width="36" height="168" rx="12" fill="#0f172a"/>
  <!-- Upper Pen Nib Tine (Exact 45 deg) -->
  <path d="M 124 118 L 180 62 C 186 56 196 54 204 54 C 214 54 218 60 214 68 L 146 126 Z" fill="#0284c7"/>
  <!-- Lower Pen Nib Tine (Exact 45 deg) -->
  <path d="M 146 130 L 214 188 C 218 196 214 202 204 202 C 196 202 186 200 180 194 L 124 138 Z" fill="#0284c7"/>
  <!-- Nib Breather Hole & Ink Drop -->
  <circle cx="120" cy="128" r="10" fill="#f59e0b"/>
  <!-- Nib Slit into Cursor -->
  <rect x="84" y="125" width="28" height="6" rx="3" fill="#f59e0b"/>

      </g>
      <!-- Brand Name -->
      <text x="36" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Klyph Nibcursor</text>
      <!-- One-line Idea -->
      <text x="36" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">The cursor writes with a pen&#x27;s soul.</text>
    </g>
    <!-- Card 2: Cleave -->
    <g transform="translate(492, 180)">
      <!-- Background Tile -->
      <rect width="420" height="520" rx="28" fill="#1e3a8a"/>
      <!-- Category Tag -->
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#bfdbfe" letter-spacing="0.5" opacity="0.85">SURGICAL REDUCER</text>
      <!-- Center Mark Area -->
      <g transform="translate(105, 76) scale(0.82)">
        
  <title id="k-cleave-title">Klyph Cleave - The K is carved with two clean chisel strokes</title>
  <!-- Left Pillar -->
  <rect x="52" y="44" width="40" height="168" rx="12" fill="#0f172a"/>
  <!-- Upper Chisel Blade (Exact 45 deg: dx=66, dy=66) -->
  <path d="M 102 116 L 168 50 C 172 46 180 44 190 44 H 210 C 218 44 222 50 218 58 L 148 128 Z" fill="#0f172a"/>
  <!-- Lower Chisel Blade (Exact 45 deg: dx=70, dy=70) -->
  <path d="M 148 128 L 218 198 C 222 206 218 212 210 212 H 190 C 180 212 172 210 168 206 L 102 140 Z" fill="#0f172a"/>
  <!-- Luminous Keystone Wedge (Exact 45 deg) -->
  <polygon points="102,96 134,128 102,160" fill="#f59e0b"/>

      </g>
      <!-- Brand Name -->
      <text x="36" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Klyph Cleave</text>
      <!-- One-line Idea -->
      <text x="36" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#bfdbfe">The K is carved with two clean chisel strokes.</text>
    </g>
    <!-- Card 3: Folio -->
    <g transform="translate(936, 180)">
      <!-- Background Tile -->
      <rect width="420" height="520" rx="28" fill="#064e3b"/>
      <!-- Category Tag -->
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0" letter-spacing="0.5" opacity="0.85">EDITORIAL ENGINE</text>
      <!-- Center Mark Area -->
      <g transform="translate(105, 76) scale(0.82)">
        
  <title id="k-folio-title">Klyph Folio - Every edit turns the page</title>
  <!-- Spine Margin Rule -->
  <rect x="52" y="44" width="36" height="168" rx="10" fill="#047857"/>
  <!-- Upper Folded Leaf (Exact 45 deg) -->
  <path d="M 98 124 L 174 48 C 178 44 186 44 196 44 H 210 C 218 44 220 52 214 58 L 144 128 Z" fill="#10b981"/>
  <!-- Lower Unfolding Leaf (Exact 45 deg) -->
  <path d="M 144 128 L 214 198 C 220 204 218 212 210 212 H 196 C 186 212 178 212 174 208 L 98 132 Z" fill="#059669"/>
  <!-- Golden Bookmark Ribbon Peak -->
  <polygon points="98,104 122,128 98,152" fill="#f59e0b"/>

      </g>
      <!-- Brand Name -->
      <text x="36" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Klyph Folio</text>
      <!-- One-line Idea -->
      <text x="36" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#a7f3d0">Every edit turns the page.</text>
    </g>
    <!-- Card 4: Dialogue -->
    <g transform="translate(48, 724)">
      <!-- Background Tile -->
      <rect width="420" height="520" rx="28" fill="#881337"/>
      <!-- Category Tag -->
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#fecdd3" letter-spacing="0.5" opacity="0.85">HUMAN TONE</text>
      <!-- Center Mark Area -->
      <g transform="translate(105, 76) scale(0.82)">
        
  <title id="k-dialogue-title">Klyph Dialogue - Two quotes snap into a K</title>
  <!-- Margin Foundation Bar -->
  <rect x="50" y="44" width="38" height="168" rx="14" fill="#0f172a"/>
  <!-- Upper Quote Chevron Blade (Exact 45 deg: dx=66, dy=66) -->
  <path d="M 120 120 L 186 54 C 192 48 202 46 210 48 C 218 50 220 56 214 62 L 148 128 Z" fill="#f43f5e"/>
  <!-- Lower Quote Chevron Blade (Exact 45 deg: dx=66, dy=66) -->
  <path d="M 148 128 L 214 194 C 220 200 218 206 210 208 C 202 210 192 208 186 202 L 120 136 Z" fill="#f43f5e"/>
  <!-- Punctuation Speech Node Core -->
  <circle cx="106" cy="128" r="12" fill="#f59e0b"/>

      </g>
      <!-- Brand Name -->
      <text x="36" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Klyph Dialogue</text>
      <!-- One-line Idea -->
      <text x="36" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#fecdd3">Two quotes snap into a K.</text>
    </g>
    <!-- Card 5: Cadence -->
    <g transform="translate(492, 724)">
      <!-- Background Tile -->
      <rect width="420" height="520" rx="28" fill="#312e81"/>
      <!-- Category Tag -->
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe" letter-spacing="0.5" opacity="0.85">RHYTHM & VOICE</text>
      <!-- Center Mark Area -->
      <g transform="translate(105, 76) scale(0.82)">
        
  <title id="k-cadence-title">Klyph Cadence - One unbroken stroke of human cadence</title>
  <!-- Single Continuous Flowing Ribbon -->
  <path d="M 72 212 L 72 74 C 72 50 96 44 116 64 L 132 80 C 144 92 162 74 176 60 C 190 46 212 56 204 74 L 148 130 L 206 188 C 214 196 206 208 194 208 C 186 208 178 204 172 198 L 128 154 L 102 180 C 86 196 72 212 72 212 Z" fill="#4f46e5"/>
  <!-- Center Heart Pulse Node -->
  <circle cx="118" cy="128" r="10" fill="#f59e0b"/>

      </g>
      <!-- Brand Name -->
      <text x="36" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Klyph Cadence</text>
      <!-- One-line Idea -->
      <text x="36" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#c7d2fe">One unbroken stroke of human cadence.</text>
    </g>
    <!-- Card 6: Prism -->
    <g transform="translate(936, 724)">
      <!-- Background Tile -->
      <rect width="420" height="520" rx="28" fill="#164e63"/>
      <!-- Category Tag -->
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#a5f3fc" letter-spacing="0.5" opacity="0.85">TONE REFRACTOR</text>
      <!-- Center Mark Area -->
      <g transform="translate(105, 76) scale(0.82)">
        
  <title id="k-prism-title">Klyph Prism - Refract the prompt into pure spectrum</title>
  <!-- Structured Input Pillar -->
  <rect x="52" y="44" width="38" height="168" rx="12" fill="#0284c7"/>
  <!-- Radiant Upper Voice Beam (Exact 45 deg) -->
  <path d="M 100 116 L 166 50 C 170 46 178 44 188 44 H 208 C 216 44 220 50 216 58 L 146 128 Z" fill="#f59e0b"/>
  <!-- Radiant Lower Voice Beam (Exact 45 deg) -->
  <path d="M 146 128 L 216 198 C 220 206 216 212 208 212 H 188 C 178 212 170 210 166 206 L 100 140 Z" fill="#f97316"/>
  <!-- Refraction Aperture Core (Exact 45 deg) -->
  <polygon points="100,100 128,128 100,156" fill="#00f0ff"/>

      </g>
      <!-- Brand Name -->
      <text x="36" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Klyph Prism</text>
      <!-- One-line Idea -->
      <text x="36" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#a5f3fc">Refract the prompt into pure spectrum.</text>
    </g>
</svg>