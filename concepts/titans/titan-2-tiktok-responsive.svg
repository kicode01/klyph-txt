  <!-- Cyan Chromatic Underlayer (Shifted -4px, +3px) -->
  <g transform="translate(-4, 3)" fill="#00f0ff" opacity="0.85">
    <path d="M 64 48 L 98 48 L 84 208 L 50 208 Z M 106 130 L 176 52 L 214 52 L 134 140 Z M 126 124 L 206 208 L 168 208 L 98 134 Z"/>
  </g>
