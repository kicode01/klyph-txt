<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="titan-3-instagram-title">
  <title id="titan-3-instagram-title">Klyph Responsive Icon - titan-3-instagram</title>
  <style>
    .mode-light { display: none; }
    .mode-dark  { display: block; }
    @media (prefers-color-scheme: light) {
      .mode-light { display: block; }
      .mode-dark  { display: none; }
    }
  </style>
  <g class="mode-dark">
    <rect width="256"height="256" rx="64" fill="#080b10"/>
  <!-- Iconic Outer Continuous Contour -->
  <rect x="44" y="44" width="168" height="168" rx="46" fill="none" stroke="#00f0ff" stroke-width="18"/>
  <!-- Central Concentric Editorial Aperture -->
  <circle cx="128" cy="128" r="42" fill="none" stroke="#00f0ff" stroke-width="18"/>
  <!-- Left Chisel Inset (Forming the subtle K ligature) -->
  <rect x="76" y="80" width="16" height="96" rx="8" fill="#00f0ff"/>
  <!-- Luminous Golden Spark (The Human/Editorial Focus) -->
  <circle cx="178" cy="78" r="13" fill="#f59e0b"/>
  </g>
  <g class="mode-light">
    <rect width="256"height="256" rx="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  <!-- Iconic Outer Continuous Contour -->
  <rect x="44" y="44" width="168" height="168" rx="46" fill="none" stroke="#0284c7" stroke-width="18"/>
  <!-- Central Concentric Editorial Aperture -->
  <circle cx="128" cy="128" r="42" fill="none" stroke="#0284c7" stroke-width="18"/>
  <!-- Left Chisel Inset (Forming the subtle K ligature) -->
  <rect x="76" y="80" width="16" height="96" rx="8" fill="#0284c7"/>
  <!-- Luminous Golden Spark (The Human/Editorial Focus) -->
  <circle cx="178" cy="78" r="13" fill="#f59e0b"/>
  </g>
</svg>
