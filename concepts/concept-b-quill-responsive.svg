<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="concept-b-quill-title">
  <title id="concept-b-quill-title">Klyph The Editorial Feather Quill</title>
  <style>
    :root {
      --klyph-base: #080b10;
      --klyph-glyph: #00f0ff;
      --klyph-keystone: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --klyph-base: #fbfaf6;
        --klyph-glyph: #0284c7;
        --klyph-keystone: #d97706;
      }
    }
    .klyph-base { fill: var(--klyph-base); }
    .klyph-glyph { fill: var(--klyph-glyph); }
    .klyph-keystone { fill: var(--klyph-keystone); }
  </style>
<rect width="256" height="256" rx="60" class="klyph-base"/>
  <!-- Central quill shaft angled at 45 deg -->
  <path d="M72 196 L196 72 L184 60 L60 184 Z" class="klyph-glyph"/>
  <!-- Upper feather vane / upper K arm -->
  <path d="M116 116 L160 72 H200 L140 132 Z" class="klyph-glyph"/>
  <!-- Lower feather vane / lower K arm -->
  <path d="M136 136 L196 196 H156 L112 152 Z" class="klyph-glyph"/>
  <!-- Golden ink nib / writing tip -->
  <polygon points="60,184 72,196 52,216 40,204" class="klyph-keystone"/>
</svg>
