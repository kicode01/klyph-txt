<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="s3-4-lattice-title">
  <title id="s3-4-lattice-title">Klyph The AST Syntax Lattice</title>
  <style>
    :root {
      --klyph-base: #080b10;
      --klyph-glyph: #00f0ff;
      --klyph-keystone: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --klyph-base: #fbfaf6;
        --klyph-glyph: #0284c7;
        --klyph-keystone: #d97706;
      }
    }
    .klyph-base { fill: var(--klyph-base); }
    .klyph-glyph { fill: var(--klyph-glyph); }
    .klyph-keystone { fill: var(--klyph-keystone); }
  </style>
<rect width="256" height="256" rx="60" class="klyph-base"/>
  <!-- Vertical foundation trunk -->
  <rect x="64" y="68" width="16" height="120" rx="4" class="klyph-glyph"/>
  <!-- Upper 45-deg lattice strut -->
  <polygon points="128,116 184,60 196,72 140,128" class="klyph-glyph"/>
  <!-- Lower 45-deg lattice strut -->
  <polygon points="140,128 196,184 184,196 128,140" class="klyph-glyph"/>
  <!-- Left root nodes -->
  <circle cx="72" cy="68" r="20" class="klyph-glyph"/>
  <circle cx="72" cy="188" r="20" class="klyph-glyph"/>
  <!-- Right branch nodes -->
  <circle cx="190" cy="66" r="20" class="klyph-glyph"/>
  <circle cx="190" cy="190" r="20" class="klyph-glyph"/>
  <!-- Center amber semantic nucleus -->
  <circle cx="128" cy="128" r="24" class="klyph-keystone"/>
</svg>
