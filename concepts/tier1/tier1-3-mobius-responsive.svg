<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="tier1-3-mobius-title">
  <title id="tier1-3-mobius-title">Klyph The Interlocking Prism</title>
  <style>
    :root {
      --klyph-base: #080b10;
      --klyph-glyph: #00f0ff;
      --klyph-keystone: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --klyph-base: #fbfaf6;
        --klyph-glyph: #0284c7;
        --klyph-keystone: #d97706;
      }
    }
    .klyph-base { fill: var(--klyph-base); }
    .klyph-glyph { fill: var(--klyph-glyph); }
    .klyph-keystone { fill: var(--klyph-keystone); }
  </style>
<rect width="256" height="256" rx="60" class="klyph-base"/>
  <!-- Pillar stem -->
  <rect x="52" y="44" width="36" height="168" rx="6" class="klyph-glyph"/>
  <!-- Upper isometric blade -->
  <polygon points="104,124 176,52 216,52 144,124" class="klyph-glyph"/>
  <!-- Lower isometric facet -->
  <polygon points="144,132 216,204 176,204 104,132" fill="#0284c7"/>
  <!-- Central amber keystone apex -->
  <polygon points="112,104 140,128 112,152 84,128" class="klyph-keystone"/>
</svg>
