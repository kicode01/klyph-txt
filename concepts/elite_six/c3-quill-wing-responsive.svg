<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="c3-quill-wing-title">
  <title id="c3-quill-wing-title">Klyph Responsive Icon - c3-quill-wing</title>
  <style>
    .mode-light { display: none; }
    .mode-dark  { display: block; }
    @media (prefers-color-scheme: light) {
      .mode-light { display: block; }
      .mode-dark  { display: none; }
    }
  </style>
  <g class="mode-dark">
    <rect width="256"height="256" rx="64" fill="#080b10"/>
  <!-- Upper Aerodynamic Wing Blade -->
  <path d="M 64 192 L 192 64 C 180 110 150 144 128 152 Z" fill="#00f0ff"/>
  <!-- Lower Chisel Foundation Facet -->
  <path d="M 64 192 L 128 152 C 110 180 86 196 64 192 Z" fill="#0284c7"/>
  <!-- Precision Editorial Slit -->
  <line x1="64" y1="192" x2="192" y2="64" stroke="#080b10" stroke-width="6" stroke-linecap="round"/>
  <!-- Golden Amber Ink Core -->
  <circle cx="128" cy="128" r="10" fill="#f59e0b"/>
  </g>
  <g class="mode-light">
    <rect width="256"height="256" rx="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  <!-- Upper Aerodynamic Wing Blade -->
  <path d="M 64 192 L 192 64 C 180 110 150 144 128 152 Z" fill="#0284c7"/>
  <!-- Lower Chisel Foundation Facet -->
  <path d="M 64 192 L 128 152 C 110 180 86 196 64 192 Z" fill="#0369a1"/>
  <!-- Precision Editorial Slit -->
  <line x1="64" y1="192" x2="192" y2="64" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- Golden Amber Ink Core -->
  <circle cx="128" cy="128" r="10" fill="#f59e0b"/>
  </g>
</svg>