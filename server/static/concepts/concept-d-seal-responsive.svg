<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="concept-d-seal-title">
  <title id="concept-d-seal-title">Klyph The Glyphic Medallion</title>
  <style>
    :root {
      --klyph-base: #080b10;
      --klyph-glyph: #00f0ff;
      --klyph-keystone: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --klyph-base: #fbfaf6;
        --klyph-glyph: #0284c7;
        --klyph-keystone: #d97706;
      }
    }
    .klyph-base { fill: var(--klyph-base); }
    .klyph-glyph { fill: var(--klyph-glyph); }
    .klyph-keystone { fill: var(--klyph-keystone); }
  </style>
<rect width="256" height="256" rx="60" class="klyph-base"/>
  <!-- Solid cyan stone medallion -->
  <circle cx="128" cy="128" r="88" class="klyph-glyph"/>
  <!-- Incised negative-space vertical channel -->
  <rect x="80" y="56" width="28" height="144" rx="4" class="klyph-base"/>
  <!-- Incised negative-space upper diagonal channel -->
  <path d="M116 132 L172 76 H196 L132 140 Z" class="klyph-base"/>
  <!-- Incised negative-space lower diagonal channel -->
  <path d="M132 116 L196 180 H172 L116 124 Z" class="klyph-base"/>
  <!-- Inset golden keystone jewel -->
  <polygon points="120,114 134,128 120,142 106,128" class="klyph-keystone"/>
</svg>
