<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="c5-title">
  <title id="c5-title">Klyph 5 - The Stencil Ingot Medallion</title>
  <rect width="256" height="256" rx="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  <!-- Solid Cyan Medallion Disc -->
  <circle cx="128" cy="128" r="88" fill="#0284c7"/>
  <!-- Negative Space Vertical Carve -->
  <rect x="76" y="56" width="28" height="144" rx="4" fill="#ffffff"/>
  <!-- Negative Space Upper Diagonal Carve -->
  <polygon points="112,132 168,76 192,76 128,140" fill="#ffffff"/>
  <!-- Negative Space Lower Diagonal Carve -->
  <polygon points="128,116 192,180 168,180 112,124" fill="#ffffff"/>
  <!-- Inset Golden Amber Jewel -->
  <polygon points="116,114 130,128 116,142 102,128" fill="#f59e0b"/>
</svg>