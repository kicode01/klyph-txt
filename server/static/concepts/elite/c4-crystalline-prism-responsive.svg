<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="c4-crystalline-prism-title">
  <title id="c4-crystalline-prism-title">Klyph Responsive Icon - c4-crystalline-prism</title>
  <style>
    .mode-light { display: none; }
    .mode-dark  { display: block; }
    @media (prefers-color-scheme: light) {
      .mode-light { display: block; }
      .mode-dark  { display: none; }
    }
  </style>
  <g class="mode-dark">
    <rect width="256"height="256" rx="64" fill="#080b10"/>
  <!-- Vertical Foundation Prism -->
  <rect x="52" y="44" width="38" height="168" rx="8" fill="#00f0ff"/>
  <!-- Upper Soaring 45-deg Crystal Facet -->
  <polygon points="104,128 180,52 216,52 140,128" fill="#00f0ff"/>
  <!-- Lower Depth Facet (Lapis) -->
  <polygon points="140,128 216,204 180,204 104,128" fill="#0284c7"/>
  <!-- Interlocking Golden Amber Keystone Jewel -->
  <polygon points="104,128 126,106 148,128 126,150" fill="#f59e0b"/>
  </g>
  <g class="mode-light">
    <rect width="256"height="256" rx="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  <!-- Vertical Foundation Prism -->
  <rect x="52" y="44" width="38" height="168" rx="8" fill="#0284c7"/>
  <!-- Upper Soaring 45-deg Crystal Facet -->
  <polygon points="104,128 180,52 216,52 140,128" fill="#0284c7"/>
  <!-- Lower Depth Facet (Lapis) -->
  <polygon points="140,128 216,204 180,204 104,128" fill="#0369a1"/>
  <!-- Interlocking Golden Amber Keystone Jewel -->
  <polygon points="104,128 126,106 148,128 126,150" fill="#f59e0b"/>
  </g>
</svg>