<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="concept-c-syntax-title">
  <title id="concept-c-syntax-title">Klyph The AST Syntax Tree</title>
  <style>
    :root {
      --klyph-base: #080b10;
      --klyph-glyph: #00f0ff;
      --klyph-keystone: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --klyph-base: #fbfaf6;
        --klyph-glyph: #0284c7;
        --klyph-keystone: #d97706;
      }
    }
    .klyph-base { fill: var(--klyph-base); }
    .klyph-glyph { fill: var(--klyph-glyph); }
    .klyph-keystone { fill: var(--klyph-keystone); }
  </style>
<rect width="256" height="256" rx="60" class="klyph-base"/>
  <!-- Vertical token anchor -->
  <rect x="52" y="44" width="36" height="168" rx="6" class="klyph-glyph"/>
  <!-- Floating upper syntax chevron -->
  <path d="M120 112 L184 48 H212 L136 124 Z" class="klyph-glyph"/>
  <!-- Floating lower syntax chevron -->
  <path d="M136 132 L212 208 H184 L120 144 Z" class="klyph-glyph"/>
  <!-- Circular AST root parse node -->
  <circle cx="116" cy="128" r="16" class="klyph-keystone"/>
</svg>
