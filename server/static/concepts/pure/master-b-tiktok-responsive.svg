<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="master-b-tiktok-title">
  <title id="master-b-tiktok-title">Klyph Responsive Icon - master-b-tiktok</title>
  <style>
    .mode-light { display: none; }
    .mode-dark  { display: block; }
    @media (prefers-color-scheme: light) {
      .mode-light { display: block; }
      .mode-dark  { display: none; }
    }
  </style>
  <g class="mode-dark">
    <rect width="256"height="256" rx="64" fill="#080b10"/>
  <!-- Cyan Chromatic Fringe (-5px, +3px) -->
  <g transform="translate(-5, 3)" fill="#00f0ff" opacity="0.9">
    <path d="M 64 44 H 102 L 86 216 H 48 Z M 112 124 L 176 44 H 220 L 144 130 Z M 136 122 L 216 216 H 172 L 102 134 Z"/>
  </g>
  <!-- Magenta Chromatic Fringe (+5px, -3px) -->
  <g transform="translate(5, -3)" fill="#ff0055" opacity="0.9">
    <path d="M 64 44 H 102 L 86 216 H 48 Z M 112 124 L 176 44 H 220 L 144 130 Z M 136 122 L 216 216 H 172 L 102 134 Z"/>
  </g>
  <!-- Core Crisp White Anchor -->
  <g fill="#ffffff">
    <path d="M 64 44 H 102 L 86 216 H 48 Z M 112 124 L 176 44 H 220 L 144 130 Z M 136 122 L 216 216 H 172 L 102 134 Z"/>
  </g>
  <!-- Central Pulse Diamond -->
  <polygon points="112,126 128,110 144,126 128,142" fill="#f59e0b"/>
  </g>
  <g class="mode-light">
    <rect width="256"height="256" rx="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  <!-- Cyan Chromatic Fringe (-5px, +3px) -->
  <g transform="translate(-5, 3)" fill="#00f0ff" opacity="0.9">
    <path d="M 64 44 H 102 L 86 216 H 48 Z M 112 124 L 176 44 H 220 L 144 130 Z M 136 122 L 216 216 H 172 L 102 134 Z"/>
  </g>
  <!-- Magenta Chromatic Fringe (+5px, -3px) -->
  <g transform="translate(5, -3)" fill="#e11d48" opacity="0.9">
    <path d="M 64 44 H 102 L 86 216 H 48 Z M 112 124 L 176 44 H 220 L 144 130 Z M 136 122 L 216 216 H 172 L 102 134 Z"/>
  </g>
  <!-- Core Crisp White Anchor -->
  <g fill="#0f172a">
    <path d="M 64 44 H 102 L 86 216 H 48 Z M 112 124 L 176 44 H 220 L 144 130 Z M 136 122 L 216 216 H 172 L 102 134 Z"/>
  </g>
  <!-- Central Pulse Diamond -->
  <polygon points="112,126 128,110 144,126 128,142" fill="#f59e0b"/>
  </g>
