<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="master-c-threads-title">
  <title id="master-c-threads-title">Klyph Responsive Icon - master-c-threads</title>
  <style>
    .mode-light { display: none; }
    .mode-dark  { display: block; }
    @media (prefers-color-scheme: light) {
      .mode-light { display: block; }
      .mode-dark  { display: none; }
    }
  </style>
  <g class="mode-dark">
    <rect width="256"height="256" rx="64" fill="#080b10"/>
  <!-- Continuous Vertical Stem -->
  <rect x="56" y="44" width="32" height="168" rx="16" fill="#00f0ff"/>
  <!-- Upper Diagonal Ribbon -->
  <path d="M 88 128 L 176 48" stroke="#00f0ff" stroke-width="32" stroke-linecap="round"/>
  <!-- Lower Diagonal Ribbon -->
  <path d="M 112 128 L 184 208" stroke="#00f0ff" stroke-width="32" stroke-linecap="round"/>
  <!-- Golden Keystone Hinge -->
  <circle cx="108" cy="128" r="12" fill="#f59e0b"/>
  </g>
  <g class="mode-light">
    <rect width="256"height="256" rx="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  <!-- Continuous Vertical Stem -->
  <rect x="56" y="44" width="32" height="168" rx="16" fill="#0284c7"/>
  <!-- Upper Diagonal Ribbon -->
  <path d="M 88 128 L 176 48" stroke="#0284c7" stroke-width="32" stroke-linecap="round"/>
  <!-- Lower Diagonal Ribbon -->
  <path d="M 112 128 L 184 208" stroke="#0284c7" stroke-width="32" stroke-linecap="round"/>
  <!-- Golden Keystone Hinge -->
  <circle cx="108" cy="128" r="12" fill="#f59e0b"/>
  </g>
</svg>