<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="s3-2-monoline-title">
  <title id="s3-2-monoline-title">Klyph The Continuous Monoline Loop</title>
  <style>
    :root {
      --klyph-base: #080b10;
      --klyph-glyph: #00f0ff;
      --klyph-keystone: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --klyph-base: #fbfaf6;
        --klyph-glyph: #0284c7;
        --klyph-keystone: #d97706;
      }
    }
    .klyph-base { fill: var(--klyph-base); }
    .klyph-glyph { fill: var(--klyph-glyph); }
    .klyph-keystone { fill: var(--klyph-keystone); }
  </style>
<rect width="256" height="256" rx="60" class="klyph-base"/>
  <!-- Continuous vertical spine -->
  <rect x="52" y="44" width="32" height="168" rx="16" class="klyph-glyph"/>
  <!-- Continuous upper diagonal loop arm -->
  <path d="M100 128 L176 52 H212 L136 128 Z" class="klyph-glyph"/>
  <!-- Continuous lower diagonal loop arm -->
  <path d="M136 128 L212 204 H176 L100 128 Z" class="klyph-glyph"/>
  <!-- Amber nexus aperture dot -->
  <circle cx="118" cy="128" r="16" class="klyph-keystone"/>
</svg>
