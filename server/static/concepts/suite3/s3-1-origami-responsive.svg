<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="s3-1-origami-title">
  <title id="s3-1-origami-title">Klyph The Origami Editorial Fold</title>
  <style>
    :root {
      --klyph-base: #080b10;
      --klyph-glyph: #00f0ff;
      --klyph-keystone: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --klyph-base: #fbfaf6;
        --klyph-glyph: #0284c7;
        --klyph-keystone: #d97706;
      }
    }
    .klyph-base { fill: var(--klyph-base); }
    .klyph-glyph { fill: var(--klyph-glyph); }
    .klyph-keystone { fill: var(--klyph-keystone); }
  </style>
<rect width="256" height="256" rx="60" class="klyph-base"/>
  <!-- Front vertical pillar -->
  <rect x="52" y="44" width="36" height="168" rx="6" class="klyph-glyph"/>
  <!-- Upper fold facet: light cyan -->
  <polygon points="96,132 176,52 216,52 136,132" class="klyph-glyph"/>
  <!-- Lower under-fold facet: deeper lapis tone creating physical depth -->
  <polygon points="120,116 200,196 160,196 96,132" fill="#0284c7"/>
  <!-- Central golden amber keystone crease -->
  <polygon points="96,132 120,108 144,132 120,156" class="klyph-keystone"/>
</svg>
